<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -90 1400 740" role="img" aria-labelledby="title desc">
  <title id="title">dap architecture</title>
  <desc id="desc">A person or an agent signs an act and sends it to a scope over the command line, MCP or HTTP. The scope pins one definition, which it read from the scope that created it, and reads the signer's grants from a membership scope before each turn. It judges the act against the definition: guards, rule expressions in a restricted JSONata, and the grants. An act that takes effect becomes one entry in the scope's journal, and the entry's declared effects are folded into the scope's items, which are whatever the definition declares. The signer gets a receipt or a refusal, and reads the state the same way. An entry's sends go to other scopes, and each judges the delivery in its own turn. Anyone can replay the journal and verify the state. A destination scope publishes the files it is sent to a Git repository on Cloudflare Artifacts or GitHub, and pages are served from that repository. Two paths are planned: an archive of the journal in the repository, and writing items to the repository directly.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#16180F"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#16180F"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#123F2B"/>
    </marker>
    <style>
      .sans { font-family: "Open Runde", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: "Sometype Mono", ui-monospace, Menlo, monospace; }
      .eyebrow { font-family: Teletype33, ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 400; }
      .title { font-size: 19px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 400; }
      .code { font-size: 13px; font-weight: 500; }
      .flow { fill: none; stroke: #16180F; stroke-width: 2.4; marker-end: url(#arrow); }
      .back { fill: none; stroke: #123F2B; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .guide { fill: none; stroke: #16180F; stroke-opacity: 0.4; stroke-width: 1.5; stroke-dasharray: 4 5; }
    </style>
  </defs>

  <rect y="-90" width="1400" height="740" fill="#F3F1EA"/>

  <!-- From other scopes: the definition and the grants -->
  <g>
    <rect x="330" y="-70" width="270" height="56" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="354" y="-48" class="sans eyebrow" fill="#16180F" fill-opacity="0.6">CREATOR SCOPE</text>
    <text x="354" y="-27" class="sans body" fill="#16180F" fill-opacity="0.7">gives the definition, once</text>
    <rect x="640" y="-70" width="320" height="56" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="664" y="-48" class="sans eyebrow" fill="#16180F" fill-opacity="0.6">MEMBERSHIP SCOPE</text>
    <text x="664" y="-27" class="sans body" fill="#16180F" fill-opacity="0.7">says who may act, read before each turn</text>
  </g>

  <!-- Signer -->
  <g class="sans">
    <rect x="38" y="172" width="184" height="176" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="130" y="208" text-anchor="middle" class="eyebrow" fill="#123F2B">SIGNER</text>
    <text x="130" y="242" text-anchor="middle" class="title" fill="#16180F">Signed act</text>
    <text x="130" y="270" text-anchor="middle" class="body" fill="#16180F" fill-opacity="0.7">people · agents</text>
    <path d="M62 290H198" stroke="#D8D5CB"/>
    <text x="130" y="320" text-anchor="middle" class="mono code" fill="#16180F">CLI · MCP · HTTP</text>
  </g>

  <!-- One scope -->
  <rect x="300" y="62" width="800" height="426" fill="#FFFFFF" fill-opacity="0.55" stroke="#D8D5CB" stroke-width="1.4"/>
  <text x="1076" y="470" text-anchor="end" class="sans eyebrow" fill="#16180F" fill-opacity="0.6">ONE SCOPE · ONE DURABLE OBJECT · ONE PINNED DEFINITION</text>

  <path d="M222 244H322" class="flow"/>
  <text x="272" y="229" text-anchor="middle" class="mono code" fill="#16180F" fill-opacity="0.7">act</text>
  <path d="M322 284H230" class="back"/>
  <text x="272" y="306" text-anchor="middle" class="mono code" fill="#123F2B">receipt</text>
  <text x="272" y="324" text-anchor="middle" class="mono code" fill="#7A1F2E">refusal</text>
  <text x="272" y="342" text-anchor="middle" class="mono code" fill="#123F2B">read</text>

  <g>
    <!-- Judge -->
    <rect x="330" y="210" width="170" height="104" fill="#FFFFFF" stroke="#123F2B" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="330" y="210" width="6" height="104" fill="#123F2B"/>
    <text x="356" y="244" class="sans eyebrow" fill="#123F2B">JUDGE</text>
    <text x="356" y="278" class="sans title" fill="#16180F">check the act</text>
    <text x="356" y="300" class="sans body" fill="#16180F" fill-opacity="0.7">guards · rules · grants</text>

    <!-- Entry -->
    <rect x="536" y="234" width="114" height="56" fill="#123F2B" fill-opacity="0.08" stroke="#123F2B" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="593" y="268" text-anchor="middle" class="mono body" fill="#123F2B">entry</text>

    <!-- Fold -->
    <rect x="686" y="210" width="156" height="104" fill="#FFFFFF" stroke="#16180F" stroke-opacity="0.4" stroke-width="1.4"/>
    <rect x="686" y="210" width="6" height="104" fill="#16180F"/>
    <text x="712" y="244" class="sans eyebrow" fill="#16180F">FOLD</text>
    <text x="712" y="278" class="sans title" fill="#16180F">apply effects</text>
    <text x="712" y="300" class="sans body" fill="#16180F" fill-opacity="0.7">states · slots</text>
  </g>

  <path d="M465 -14V82" class="flow"/>
  <text x="477" y="40" class="mono code" fill="#16180F" fill-opacity="0.7">definition</text>
  <path d="M668 -14V178H470V202" class="flow"/>
  <text x="680" y="40" class="mono code" fill="#16180F" fill-opacity="0.7">grants</text>
  <path d="M500 262H528" class="flow"/>
  <path d="M650 262H678" class="flow"/>

  <!-- Definition sources: what is declared -->
  <g>
    <rect x="330" y="90" width="320" height="60" fill="#16180F"/>
    <text x="350" y="112" class="mono code" fill="#F3F1EA" fill-opacity="0.6">definition.json · acts</text>
    <text x="350" y="137" class="mono code" fill="#F3F1EA"><tspan fill="#FFFFFF">act</tspan> fields, guards, effects, sends</text>
    <rect x="686" y="90" width="386" height="60" fill="#16180F"/>
    <text x="706" y="112" class="mono code" fill="#F3F1EA" fill-opacity="0.6">definition.json · items</text>
    <text x="706" y="137" class="mono code" fill="#F3F1EA"><tspan fill="#FFFFFF">item</tspan> states, parties, references, values</text>
  </g>
  <path d="M415 150V202" class="guide"/>
  <path d="M966 150V180" class="guide"/>

  <!-- Rule expressions -->
  <g>
    <rect x="330" y="348" width="170" height="64" fill="#16180F"/>
    <text x="415" y="373" text-anchor="middle" class="mono code" fill="#FFFFFF">rules</text>
    <text x="415" y="397" text-anchor="middle" class="mono code" fill="#F3F1EA" fill-opacity="0.6">restricted JSONata</text>
  </g>
  <path d="M415 348V322" class="guide"/>

  <!-- Journal -->
  <path d="M593 290V340" class="flow"/>
  <g>
    <rect x="520" y="348" width="150" height="64" fill="#FFFFFF" stroke="#123F2B" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="544" y="374" class="sans eyebrow" fill="#123F2B">JOURNAL</text>
    <text x="544" y="398" class="sans body" fill="#16180F" fill-opacity="0.7">ordered · hashed</text>
  </g>


  <!-- Items -->
  <path d="M842 262H867" class="flow"/>
  <g>
    <rect x="874" y="188" width="198" height="148" fill="#FFFFFF" stroke="#16180F" stroke-opacity="0.4" stroke-width="1.4"/>
    <rect x="886" y="214" width="174" height="90" fill="#F3F1EA" stroke="#D8D5CB"/>
    <path d="M886 244H1060M886 274H1060" stroke="#D8D5CB"/>
    <text x="973" y="234" text-anchor="middle" class="sans eyebrow" fill="#16180F">ITEMS</text>
    <text x="973" y="265" text-anchor="middle" class="mono code" fill="#16180F">thing · count · lent</text>
    <text x="973" y="295" text-anchor="middle" class="mono code" fill="#16180F">issue · turn · ...</text>
    <text x="973" y="323" text-anchor="middle" class="sans body" fill="#16180F" fill-opacity="0.7">whatever you declare</text>
  </g>

  <!-- Replay -->
  <path d="M540 412V508" fill="none" stroke="#123F2B" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow-green)"/>
  <g>
    <rect x="330" y="516" width="250" height="64" fill="#FFFFFF" stroke="#123F2B" stroke-opacity="0.45" stroke-width="1.4"/>
    <text x="354" y="542" class="sans eyebrow" fill="#123F2B">REPLAY · VERIFY</text>
    <text x="354" y="566" class="sans body" fill="#16180F" fill-opacity="0.7">anyone can fold it again</text>
  </g>

  <!-- Other scopes -->
  <path d="M600 412V548H858" class="flow"/>
  <text x="726" y="538" text-anchor="middle" class="mono code" fill="#16180F" fill-opacity="0.7">sends</text>
  <g>
    <rect x="866" y="516" width="296" height="64" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="890" y="542" class="sans eyebrow" fill="#16180F" fill-opacity="0.6">DESTINATION SCOPE</text>
    <text x="890" y="566" class="sans body" fill="#16180F" fill-opacity="0.7">a destination publishes files</text>
  </g>

  <!-- Git repository, and the pages it drives -->
  <path d="M655 412V440H1236V352" fill="none" stroke="#16180F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="1110" y="430" text-anchor="middle" class="mono code" fill="#16180F">archive · planned</text>
  <path d="M1162 548H1304V352" class="flow"/>
  <text x="1236" y="538" text-anchor="middle" class="mono code" fill="#16180F" fill-opacity="0.7">publish</text>
  <path d="M1072 262H1170" fill="none" stroke="#16180F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/>
  <text x="1124" y="250" text-anchor="middle" class="mono code" fill="#16180F">planned</text>
  <path d="M1270 220V196" class="flow"/>
  <g class="sans">
    <rect x="1178" y="220" width="184" height="124" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="1270" y="254" text-anchor="middle" class="eyebrow" fill="#123F2B">GIT REPOSITORY</text>
    <text x="1270" y="288" text-anchor="middle" style="font-size:17px;font-weight:700" fill="#16180F">Cloudflare Artifacts</text>
    <text x="1270" y="318" text-anchor="middle" style="font-size:17px;font-weight:700" fill="#16180F">GitHub</text>
    <rect x="1178" y="132" width="184" height="56" fill="#FFFFFF" stroke="#D8D5CB"/>
    <text x="1270" y="156" text-anchor="middle" class="eyebrow" fill="#16180F" fill-opacity="0.6">PAGES</text>
    <text x="1270" y="176" text-anchor="middle" class="body" fill="#16180F" fill-opacity="0.7">served from the repository</text>
  </g>

  <text x="700" y="624" text-anchor="middle" class="sans body" fill="#16180F" fill-opacity="0.7">One runtime runs every application. An application is its definitions.</text>
</svg>

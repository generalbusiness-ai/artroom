:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  color: var(--foreground);

  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);

.table-responsive {

.table {

  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {

  border: 0;

}

.viz-badge {

}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  color: var(--muted-foreground);

.nav-pills .nav-link {

  color: var(--muted-foreground);

.nav-pills .nav-link.active {

.viz-carousel:has(&gt; .viz-carousel-controls) {

    const nav=`&lt;nav class=&quot;ar-nav&quot; aria-label=&quot;Room&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;issues&quot; ${current===&#x27;issues&#x27;?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;Issues&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;changes&quot; ${current===&#x27;changes&#x27;?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;Changes&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;pages&quot; ${current===&#x27;pages&#x27;?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;Pages&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;rules&quot; ${current===&#x27;rules&#x27;?&#x27;aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;Settings&lt;/button&gt;&lt;/nav&gt;`;
    return `&lt;header class=&quot;ar-top&quot;&gt;&lt;div class=&quot;ar-brand&quot;&gt;&lt;span class=&quot;ar-mark&quot; aria-hidden=&quot;true&quot;&gt;a&lt;/span&gt; Artroom&lt;/div&gt;&lt;span class=&quot;ar-crumb&quot;&gt;/ ${escape(state.roomName)}&lt;/span&gt;&lt;button class=&quot;ar-account&quot; type=&quot;button&quot; data-action=&quot;account&quot; aria-label=&quot;View your account&quot;&gt;H&lt;/button&gt;&lt;/header&gt;${![&#x27;issues&#x27;,&#x27;changes&#x27;,&#x27;pages&#x27;].includes(state.screen)?&#x27;&#x27;:`&lt;div class=&quot;ar-roomhead&quot;&gt;&lt;div&gt;&lt;h1&gt;${escape(state.roomName)}&lt;/h1&gt;&lt;/div&gt;&lt;div class=&quot;ar-actions&quot;&gt;${btn(&#x27;Edit page&#x27;,&#x27;edit&#x27;)}${btn(&#x27;Open site&#x27;,&#x27;site&#x27;)}&lt;/div&gt;&lt;/div&gt;`}&lt;div class=&quot;ar-shell&quot;&gt;${state.screen===&#x27;create&#x27;?&#x27;&#x27;:nav}&lt;main class=&quot;ar-body&quot;&gt;${state.notice?`&lt;div class=&quot;ar-alert&quot; role=&quot;status&quot;&gt;${escape(state.notice)}&lt;/div&gt;`:&#x27;&#x27;}${content}&lt;/main&gt;&lt;/div&gt;`;
  }
  function listScreen(type){
    const isIssue=type===&#x27;issues&#x27;,all=isIssue?issues:changes,empty=state.sample===&#x27;empty&#x27;||state.localEmpty;
    const closed=isIssue?&#x27;closed&#x27;:&#x27;merged&#x27;,selected=state.filter===&#x27;open&#x27;?&#x27;open&#x27;:closed;
    const matches=empty?[]:all.filter(x=&gt;(state.filter===&#x27;all&#x27;||x.status===selected)&amp;&amp;(`${x.title} ${x.n} ${x.author} ${x.file||&#x27;&#x27;}`).toLowerCase().includes(state.query.toLowerCase()));
    const openCount=empty?0:all.filter(x=&gt;x.status===&#x27;open&#x27;).length,closedCount=empty?0:all.length-openCount;
    const items=matches.map(x=&gt;`&lt;article class=&quot;ar-item&quot;&gt;&lt;span class=&quot;ar-dot ${x.status!==&#x27;open&#x27;?&#x27;closed&#x27;:&#x27;&#x27;}&quot; aria-label=&quot;${x.status}&quot;&gt;${x.status!==&#x27;open&#x27;?&#x27;✓&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;div class=&quot;ar-item-main&quot;&gt;&lt;button class=&quot;ar-item-title&quot; data-action=&quot;${isIssue?&#x27;issue-detail&#x27;:&#x27;detail&#x27;}&quot; data-number=&quot;${x.n}&quot; type=&quot;button&quot;&gt;${escape(x.title)}&lt;/button&gt;&lt;div class=&quot;ar-item-meta&quot;&gt;&lt;span&gt;#${x.n} · ${x.status===&#x27;merged&#x27;?&#x27;merged&#x27;:&#x27;opened&#x27;} by ${x.author}&lt;/span&gt;&lt;span&gt;${isIssue?escape(x.assignee):escape(x.file)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${tag(isIssue?x.label:x.readiness,isIssue?&#x27;&#x27;:x.kind)}&lt;/article&gt;`).join(&#x27;&#x27;);
    const emptyContent=empty?`&lt;div class=&quot;ar-empty&quot;&gt;&lt;h3&gt;${isIssue?&#x27;Start with one thing to do&#x27;:&#x27;Your first change starts with an edit&#x27;}&lt;/h3&gt;&lt;p&gt;${isIssue?&#x27;Capture a question, a problem, or an idea. You can add the details as the work takes shape.&#x27;:&#x27;Edit a page to propose a change. Reviews and publication stay connected to the work.&#x27;}&lt;/p&gt;${btn(isIssue?&#x27;Create issue&#x27;:&#x27;Edit page&#x27;,isIssue?&#x27;new-issue&#x27;:&#x27;edit&#x27;,true)}&lt;/div&gt;`:`&lt;div class=&quot;ar-empty&quot;&gt;&lt;h3&gt;No ${type} match&lt;/h3&gt;&lt;p&gt;Try a different status or search.&lt;/p&gt;${btn(&#x27;Clear filters&#x27;,&#x27;clear&#x27;)}&lt;/div&gt;`;
    return `&lt;div class=&quot;ar-toolbar&quot;&gt;&lt;div&gt;&lt;h2&gt;${isIssue?&#x27;Issues&#x27;:&#x27;Changes&#x27;}&lt;/h2&gt;&lt;span class=&quot;ar-muted ar-small&quot;&gt;${isIssue?&#x27;Plan and track the work.&#x27;:&#x27;Review proposed work and follow publication.&#x27;}&lt;/span&gt;&lt;/div&gt;${btn(isIssue?&#x27;Create issue&#x27;:&#x27;Edit page&#x27;,isIssue?&#x27;new-issue&#x27;:&#x27;edit&#x27;,true)}&lt;/div&gt;&lt;div class=&quot;ar-toolbar&quot;&gt;&lt;input type=&quot;search&quot; class=&quot;ar-input ar-search&quot; data-search aria-label=&quot;Search ${type}&quot; placeholder=&quot;Search ${type}…&quot; value=&quot;${escape(state.query)}&quot;&gt;&lt;div class=&quot;ar-filters&quot; aria-label=&quot;Filter ${type} by status&quot;&gt;${[&#x27;open&#x27;,closed,&#x27;all&#x27;].map((f,i)=&gt;`&lt;button class=&quot;ar-filter&quot; type=&quot;button&quot; data-filter=&quot;${f}&quot; aria-pressed=&quot;${state.filter===f}&quot;&gt;${f[0].toUpperCase()+f.slice(1)}&lt;span class=&quot;ar-count&quot;&gt;${i===0?openCount:i===1?closedCount:openCount+closedCount}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ar-list&quot;&gt;&lt;div class=&quot;ar-listhead&quot; data-results&gt;${matches.length} ${matches.length===1?&#x27;result&#x27;:&#x27;results&#x27;}${!isIssue?&#x27; · Proposal status and publication are shown separately&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div data-rows&gt;${items||emptyContent}&lt;/div&gt;&lt;/div&gt;`;
  }
  function detail(){
    const mode=[&#x27;path&#x27;,&#x27;pending&#x27;,&#x27;published&#x27;].includes(state.sample)?state.sample:&#x27;review&#x27;;
    const path=mode===&#x27;path&#x27;,published=mode===&#x27;published&#x27;,pending=mode===&#x27;pending&#x27;;
    const title=path?&#x27;Add an introductory page&#x27;:published?&#x27;Add the getting-started guide&#x27;:&#x27;Clarify the agent instructions&#x27;;
    let status=path?`&lt;div class=&quot;ar-status bad&quot;&gt;&lt;h3&gt;Publication refused · invalid file path&lt;/h3&gt;&lt;p&gt;&lt;code&gt;../outside.md&lt;/code&gt; is outside the room. The change is still open. Change the path before trying again.&lt;/p&gt;${btn(&#x27;Fix path&#x27;,&#x27;fix-path&#x27;,true)}&lt;/div&gt;`:published?`&lt;div class=&quot;ar-status good&quot;&gt;&lt;h3&gt;Published&lt;/h3&gt;&lt;p&gt;This version was published successfully. Issue #1 was closed by this publication.&lt;/p&gt;&lt;div class=&quot;ar-actions&quot;&gt;${btn(&#x27;View this published version&#x27;,&#x27;published-version&#x27;,true)}${btn(&#x27;View latest site&#x27;,&#x27;site&#x27;)}&lt;/div&gt;&lt;/div&gt;`:pending?`&lt;div class=&quot;ar-status&quot;&gt;&lt;h3&gt;Publication pending&lt;/h3&gt;&lt;p&gt;The request is recorded. The destination has not confirmed publication yet. The change remains open.&lt;/p&gt;${btn(&#x27;Check publication&#x27;,&#x27;check-publication&#x27;)}&lt;/div&gt;`:state.approved?`&lt;div class=&quot;ar-status&quot;&gt;&lt;h3&gt;Review recorded for this version&lt;/h3&gt;&lt;p&gt;Current room rules will be checked when you publish. An approval alone does not confirm publication.&lt;/p&gt;${btn(&#x27;Publish change&#x27;,&#x27;publish&#x27;,true)}&lt;/div&gt;`:`&lt;div class=&quot;ar-status&quot;&gt;&lt;h3&gt;Needs approval for protected files&lt;/h3&gt;&lt;p&gt;AGENTS.md needs one approval from a rules controller. The last publication attempt was refused. The change is still open.&lt;/p&gt;&lt;div class=&quot;ar-actions&quot;&gt;${btn(&#x27;Review change&#x27;,&#x27;review&#x27;,true)}${btn(&#x27;Request review&#x27;,&#x27;request-review&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    const discussion=`&lt;div class=&quot;ar-panel&quot;&gt;&lt;h3&gt;@paul proposed this change&lt;/h3&gt;&lt;p&gt;${published?&#x27;Add a short guide for the first clone and edit.&#x27;:path?&#x27;Add an introductory page for new members.&#x27;:&#x27;Make the instructions clear about when a review is needed.&#x27;}&lt;/p&gt;${published?&#x27;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Closes issue #1 · Add a getting-started page&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;ar-event&quot;&gt;&lt;span class=&quot;ar-avatar&quot; aria-hidden=&quot;true&quot;&gt;P&lt;/span&gt;&lt;div class=&quot;ar-event-main&quot;&gt;&lt;strong&gt;@paul&lt;/strong&gt;&lt;p&gt;Please check the wording before this is published.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;form data-form=&quot;comment&quot;&gt;&lt;label class=&quot;ar-small&quot; for=&quot;${this.prefix}-comment&quot;&gt;Add a comment&lt;/label&gt;&lt;textarea class=&quot;ar-input&quot; id=&quot;${this.prefix}-comment&quot; name=&quot;comment&quot; rows=&quot;3&quot; placeholder=&quot;Share a question or feedback…&quot; required&gt;&lt;/textarea&gt;&lt;div class=&quot;ar-actions&quot; style=&quot;margin-top:10px&quot;&gt;${btn(&#x27;Comment&#x27;,&#x27;submit-comment&#x27;)}&lt;/div&gt;&lt;/form&gt;`;
    const file=path?&#x27;../outside.md&#x27;:published?&#x27;guide/start.md&#x27;:&#x27;AGENTS.md&#x27;;
    const files=`&lt;div class=&quot;ar-panel&quot;&gt;&lt;h3&gt;${escape(file)}&lt;/h3&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Proposed version · one file&lt;/p&gt;&lt;code class=&quot;ar-diff-add&quot;&gt;+ ${published?&#x27;# Getting started\n+ Clone the room, then edit a page.&#x27;:&#x27;# Agent instructions\n+ Ask for review before publishing protected files.&#x27;}&lt;/code&gt;&lt;div class=&quot;ar-actions&quot; style=&quot;margin-top:16px&quot;&gt;${btn(&#x27;Preview this version&#x27;,&#x27;preview&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    const checks=`&lt;div class=&quot;ar-panel&quot;&gt;&lt;h3&gt;Publication requirements&lt;/h3&gt;&lt;p&gt;${path?&#x27;File path validation failed.&#x27;:published?&#x27;The destination confirmed publication for this version.&#x27;:pending?&#x27;Waiting for the destination to confirm the result.&#x27;:&#x27;Protected-file review: &#x27;+(state.approved?&#x27;one approval recorded.&#x27;:&#x27;one rules controller approval needed.&#x27;)}&lt;/p&gt;&lt;p class=&quot;ar-muted&quot;&gt;No automated checks are required in this sample room.&lt;/p&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;The destination evaluates the current room rules at publication. Reviews apply to a specific proposal version.&lt;/p&gt;${btn(&#x27;Configure rules&#x27;,&#x27;rules&#x27;)}&lt;/div&gt;`;
    return `&lt;button class=&quot;ar-link&quot; data-action=&quot;changes&quot; type=&quot;button&quot;&gt;← Back to changes&lt;/button&gt;&lt;h2&gt;${title} &lt;span class=&quot;ar-muted&quot;&gt;#${path?4:published?2:3}&lt;/span&gt;&lt;/h2&gt;&lt;div class=&quot;ar-detailhead&quot;&gt;${tag(published?&#x27;Merged&#x27;:&#x27;Open&#x27;,published?&#x27;good&#x27;:&#x27;&#x27;)}&lt;span class=&quot;ar-muted ar-small&quot;&gt;@paul proposed one file · Version 5&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ar-grid&quot;&gt;&lt;div&gt;${status}&lt;nav class=&quot;ar-detailnav&quot; aria-label=&quot;Change detail&quot;&gt;${[&#x27;discussion&#x27;,&#x27;files&#x27;,&#x27;checks&#x27;].map(x=&gt;`&lt;button class=&quot;ar-filter&quot; type=&quot;button&quot; data-tab=&quot;${x}&quot; aria-pressed=&quot;${state.tab===x}&quot;&gt;${x[0].toUpperCase()+x.slice(1)}${x===&#x27;files&#x27;?&#x27; · 1&#x27;:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/nav&gt;${state.tab===&#x27;files&#x27;?files:state.tab===&#x27;checks&#x27;?checks:discussion}&lt;/div&gt;&lt;aside class=&quot;ar-sideinfo&quot;&gt;&lt;h3&gt;Reviewers&lt;/h3&gt;&lt;p&gt;@hugh &lt;span class=&quot;ar-muted&quot;&gt;· Rules controller&lt;/span&gt;&lt;/p&gt;&lt;h3&gt;Changed file&lt;/h3&gt;&lt;p&gt;${escape(file)}&lt;/p&gt;&lt;h3&gt;Related work&lt;/h3&gt;&lt;p&gt;${published?&#x27;Issue #1 · Completed&#x27;:&#x27;No linked issue&#x27;}&lt;/p&gt;&lt;button class=&quot;ar-link&quot; data-action=&quot;preview&quot; type=&quot;button&quot;&gt;Preview this version&lt;/button&gt;&lt;details&gt;&lt;summary&gt;Technical details&lt;/summary&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Full version evidence, rule revisions, and publication receipts belong here. They are omitted from this design sample.&lt;/p&gt;&lt;/details&gt;&lt;/aside&gt;&lt;/div&gt;`;
  }
  function create(){return `&lt;div class=&quot;ar-form&quot;&gt;&lt;button class=&quot;ar-link&quot; data-action=&quot;issues&quot; type=&quot;button&quot;&gt;← Back to rooms&lt;/button&gt;&lt;h2&gt;Create a room&lt;/h2&gt;&lt;p class=&quot;ar-muted&quot;&gt;Give the work a home. You can invite people and adjust the rules later.&lt;/p&gt;&lt;form data-form=&quot;create&quot;&gt;&lt;label for=&quot;${this.prefix}-name&quot;&gt;Room name&lt;/label&gt;&lt;input class=&quot;ar-input&quot; id=&quot;${this.prefix}-name&quot; name=&quot;name&quot; placeholder=&quot;Field notes&quot; required maxlength=&quot;80&quot;&gt;&lt;label for=&quot;${this.prefix}-path&quot;&gt;Room address&lt;/label&gt;&lt;input class=&quot;ar-input&quot; id=&quot;${this.prefix}-path&quot; name=&quot;path&quot; placeholder=&quot;field-notes&quot; pattern=&quot;[a-z0-9]+(-[a-z0-9]+)*&quot; required&gt;&lt;p class=&quot;ar-help&quot;&gt;Your workspace / &lt;span data-slug&gt;field-notes&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;ar-panel&quot;&gt;&lt;h3&gt;Ready for the first edit&lt;/h3&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Issues and changes are enabled. Protected files require a rules controller review. Publication happens only when you choose Publish.&lt;/p&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Advanced setup&lt;/summary&gt;&lt;label for=&quot;${this.prefix}-remote&quot;&gt;Import an existing repository&lt;/label&gt;&lt;input class=&quot;ar-input&quot; id=&quot;${this.prefix}-remote&quot; name=&quot;remote&quot; placeholder=&quot;Repository URL (optional)&quot;&gt;&lt;p class=&quot;ar-help&quot;&gt;Leave this empty to start a new room. Hosting and rule details can be configured later.&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;ar-actions&quot;&gt;&lt;button type=&quot;button&quot; data-submit class=&quot;ar-btn ar-primary&quot;&gt;Create room&lt;/button&gt;${btn(&#x27;Cancel&#x27;,&#x27;issues&#x27;)}&lt;/div&gt;&lt;/form&gt;&lt;/div&gt;`;}
  function rules(){return `&lt;div class=&quot;ar-toolbar&quot;&gt;&lt;div&gt;&lt;h2&gt;Configure rules&lt;/h2&gt;&lt;p class=&quot;ar-muted&quot;&gt;Choose how work is reviewed before publication.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;form data-form=&quot;rules&quot;&gt;&lt;div class=&quot;ar-rule&quot;&gt;&lt;div class=&quot;ar-rule-main&quot;&gt;&lt;label for=&quot;${this.prefix}-ordinary&quot;&gt;Ordinary files&lt;/label&gt;&lt;p&gt;Pages, documentation, and other files outside protected groups.&lt;/p&gt;&lt;/div&gt;&lt;select class=&quot;ar-input&quot; id=&quot;${this.prefix}-ordinary&quot; name=&quot;ordinary&quot;&gt;&lt;option&gt;No approval required&lt;/option&gt;&lt;option&gt;One reviewer required&lt;/option&gt;&lt;option&gt;Two reviewers required&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;ar-rule&quot;&gt;&lt;div class=&quot;ar-rule-main&quot;&gt;&lt;label for=&quot;${this.prefix}-protected&quot;&gt;Protected instructions and workflows&lt;/label&gt;&lt;p&gt;AGENTS.md, CLAUDE.md, and automation workflows. Approval must come from a rules controller.&lt;/p&gt;&lt;/div&gt;&lt;select class=&quot;ar-input&quot; id=&quot;${this.prefix}-protected&quot; name=&quot;protected&quot;&gt;&lt;option&gt;One controller required&lt;/option&gt;&lt;option&gt;Two controllers required&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;ar-rule&quot;&gt;&lt;div class=&quot;ar-rule-main&quot;&gt;&lt;label for=&quot;${this.prefix}-infra&quot;&gt;Infrastructure files&lt;/label&gt;&lt;p&gt;Git configuration and deployment settings outside the protected group. Approval comes from a maintainer.&lt;/p&gt;&lt;/div&gt;&lt;select class=&quot;ar-input&quot; id=&quot;${this.prefix}-infra&quot; name=&quot;infra&quot;&gt;&lt;option&gt;No approval required&lt;/option&gt;&lt;option&gt;One maintainer required&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;ar-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;${this.prefix}-own&quot; name=&quot;own&quot;&gt;&lt;label for=&quot;${this.prefix}-own&quot;&gt;Allow an author&#x27;s controller to approve their own work&lt;br&gt;&lt;span class=&quot;ar-muted ar-small&quot;&gt;Off by default. A controller review is separate from authorship.&lt;/span&gt;&lt;/label&gt;&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Advanced rules&lt;/summary&gt;&lt;label for=&quot;${this.prefix}-patterns&quot;&gt;Protected file patterns&lt;/label&gt;&lt;textarea class=&quot;ar-input ar-code&quot; id=&quot;${this.prefix}-patterns&quot; name=&quot;patterns&quot; rows=&quot;4&quot;&gt;**/AGENTS.md\n**/CLAUDE.md\n.github/workflows/**\n.github/actions/**&lt;/textarea&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Rules changes require permission to publish room rules. Pattern validation and conflict detection are required before applying them.&lt;/p&gt;&lt;/details&gt;&lt;div class=&quot;ar-panel&quot;&gt;&lt;h3&gt;Before you apply&lt;/h3&gt;&lt;p class=&quot;ar-muted&quot;&gt;New rules are evaluated when a change is published. Existing proposals may need new approvals.&lt;/p&gt;&lt;p class=&quot;ar-muted ar-small&quot;&gt;Signed in as @hugh · Rules controller&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ar-actions&quot;&gt;&lt;button class=&quot;ar-btn ar-primary&quot; type=&quot;button&quot; data-submit&gt;Review rule changes&lt;/button&gt;${btn(&#x27;Cancel&#x27;,&#x27;issues&#x27;)}&lt;/div&gt;&lt;/form&gt;`;}

<div id="artroom-design-preview">
  <div class="viz-row" style="justify-content:space-between;padding:8px 0 14px">
    <span class="text-small">Design preview · sample data</span>
    <span class="text-small">Proposed experience</span>
  </div>
  <div class="viz-controls">
    <label class="form-label">Screen
      <select class="form-select" id="ar-screen">
        <option value="issues">Issues</option><option value="changes">Changes</option><option value="detail">Change detail</option><option value="create">Create room</option><option value="rules">Configure rules</option>
      </select>
    </label>
    <label class="form-label">Device
      <select class="form-select" id="ar-device"><option value="desktop">Desktop</option><option value="390">Mobile · 390 px</option><option value="320">Mobile · 320 px</option></select>
    </label>
    <label class="form-label">Sample state
      <select class="form-select" id="ar-state"><option value="populated">Populated</option><option value="empty">New room · empty</option><option value="review">Needs review</option><option value="path">Publication refused · invalid path</option><option value="pending">Publication pending</option><option value="published">Publication confirmed</option></select>
    </label>
  </div>
  <div class="viz-carousel" aria-label="Artroom navigation designs">
    <section data-variant="Room tabs" aria-label="Room tabs design"><div class="ar-stage"><div class="ar-app" data-layout="tabs" aria-label="Artroom room tabs"></div></div></section>
    <section data-variant="Workspace sidebar" aria-label="Workspace sidebar design" hidden><div class="ar-stage"><div class="ar-app" data-layout="sidebar" aria-label="Artroom workspace sidebar"></div></div></section>
  </div>
  <span class="sr-only" id="ar-live" aria-live="polite"></span>
</div>

<script>
(() => {
  const root=document.getElementById('artroom-design-preview');
  const apps=[...root.querySelectorAll('.ar-app')];
  const controls={screen:root.querySelector('#ar-screen'),device:root.querySelector('#ar-device'),state:root.querySelector('#ar-state')};
  const saved=window.openai?.widgetState?.privateContent;
  let state={screen:'issues',device:'desktop',sample:'populated',filter:'open',query:'',tab:'discussion',notice:'',approved:false,roomName:'Field notes',localEmpty:false};
  if(saved&&typeof saved==='object') for(const key of ['screen','device','sample']) if(typeof saved[key]==='string')state[key]=saved[key];
  const issues=[{n:5,title:'Make the first edit easier to find',status:'open',author:'@una',assignee:'@paul',label:'Usability'},{n:6,title:'Explain who can approve protected files',status:'open',author:'@paul',assignee:'Unassigned',label:'Documentation'},{n:1,title:'Add a getting-started page',status:'closed',author:'@una',assignee:'@paul',label:'Documentation'}];
  const changes=[{n:3,title:'Clarify the agent instructions',status:'open',author:'@paul',file:'AGENTS.md',readiness:'Needs review',kind:'warn'},{n:4,title:'Add an introductory page',status:'open',author:'@paul',file:'../outside.md',readiness:'Publication refused',kind:'bad'},{n:2,title:'Add the getting-started guide',status:'merged',author:'@paul',file:'guide/start.md',readiness:'Published',kind:'good'}];
  const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const btn=(label,action,primary=false,extra='')=>`<button type="button" class="ar-btn${primary?' ar-primary':''}" data-action="${action}" ${extra}>${label}</button>`;
  const tag=(label,kind='')=>`<span class="ar-tag ${kind}">${label}</span>`;
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.screen,device:state.device,sample:state.sample},privateContent:{screen:state.screen,device:state.device,sample:state.sample}}).catch(()=>{});}
  function announce(text){root.querySelector('#ar-live').textContent=text;}
  function setScreen(screen){state.screen=screen;state.query='';state.filter='open';state.notice='';state.tab='discussion';render();remember();}
  function shell(app,content){
    const current=state.screen==='detail'?'changes':(['issue-detail','new-issue'].includes(state.screen)?'issues':state.screen);
    const nav=`<nav class="ar-nav" aria-label="Room"><button type="button" data-action="issues" ${current==='issues'?'aria-current="page"':''}>Issues</button><button type="button" data-action="changes" ${current==='changes'?'aria-current="page"':''}>Changes</button><button type="button" data-action="pages" ${current==='pages'?'aria-current="page"':''}>Pages</button><button type="button" data-action="rules" ${current==='rules'?'aria-current="page"':''}>Settings</button></nav>`;
    return `<header class="ar-top"><div class="ar-brand"><span class="ar-mark" aria-hidden="true">a</span> Artroom</div><span class="ar-crumb">/ ${escape(state.roomName)}</span><button class="ar-account" type="button" data-action="account" aria-label="View your account">H</button></header>${!['issues','changes','pages'].includes(state.screen)?'':`<div class="ar-roomhead"><div><h1>${escape(state.roomName)}</h1></div><div class="ar-actions">${btn('Edit page','edit')}${btn('Open site','site')}</div></div>`}<div class="ar-shell">${state.screen==='create'?'':nav}<main class="ar-body">${state.notice?`<div class="ar-alert" role="status">${escape(state.notice)}</div>`:''}${content}</main></div>`;
  }
  function listScreen(type){
    const isIssue=type==='issues',all=isIssue?issues:changes,empty=state.sample==='empty'||state.localEmpty;
    const closed=isIssue?'closed':'merged',selected=state.filter==='open'?'open':closed;
    const matches=empty?[]:all.filter(x=>(state.filter==='all'||x.status===selected)&&(`${x.title} ${x.n} ${x.author} ${x.file||''}`).toLowerCase().includes(state.query.toLowerCase()));
    const openCount=empty?0:all.filter(x=>x.status==='open').length,closedCount=empty?0:all.length-openCount;
    const items=matches.map(x=>`<article class="ar-item"><span class="ar-dot ${x.status!=='open'?'closed':''}" aria-label="${x.status}">${x.status!=='open'?'✓':''}</span><div class="ar-item-main"><button class="ar-item-title" data-action="${isIssue?'issue-detail':'detail'}" data-number="${x.n}" type="button">${escape(x.title)}</button><div class="ar-item-meta"><span>#${x.n} · ${x.status==='merged'?'merged':'opened'} by ${x.author}</span><span>${isIssue?escape(x.assignee):escape(x.file)}</span></div></div>${tag(isIssue?x.label:x.readiness,isIssue?'':x.kind)}</article>`).join('');
    const emptyContent=empty?`<div class="ar-empty"><h3>${isIssue?'Start with one thing to do':'Your first change starts with an edit'}</h3><p>${isIssue?'Capture a question, a problem, or an idea. You can add the details as the work takes shape.':'Edit a page to propose a change. Reviews and publication stay connected to the work.'}</p>${btn(isIssue?'Create issue':'Edit page',isIssue?'new-issue':'edit',true)}</div>`:`<div class="ar-empty"><h3>No ${type} match</h3><p>Try a different status or search.</p>${btn('Clear filters','clear')}</div>`;
    return `<div class="ar-toolbar"><div><h2>${isIssue?'Issues':'Changes'}</h2><span class="ar-muted ar-small">${isIssue?'Plan and track the work.':'Review proposed work and follow publication.'}</span></div>${btn(isIssue?'Create issue':'Edit page',isIssue?'new-issue':'edit',true)}</div><div class="ar-toolbar"><input type="search" class="ar-input ar-search" data-search aria-label="Search ${type}" placeholder="Search ${type}…" value="${escape(state.query)}"><div class="ar-filters" aria-label="Filter ${type} by status">${['open',closed,'all'].map((f,i)=>`<button class="ar-filter" type="button" data-filter="${f}" aria-pressed="${state.filter===f}">${f[0].toUpperCase()+f.slice(1)}<span class="ar-count">${i===0?openCount:i===1?closedCount:openCount+closedCount}</span></button>`).join('')}</div></div><div class="ar-list"><div class="ar-listhead" data-results>${matches.length} ${matches.length===1?'result':'results'}${!isIssue?' · Proposal status and publication are shown separately':''}</div><div data-rows>${items||emptyContent}</div></div>`;
  }
  function detail(){
    const mode=['path','pending','published'].includes(state.sample)?state.sample:'review';
    const path=mode==='path',published=mode==='published',pending=mode==='pending';
    const title=path?'Add an introductory page':published?'Add the getting-started guide':'Clarify the agent instructions';
    let status=path?`<div class="ar-status bad"><h3>Publication refused · invalid file path</h3><p><code>../outside.md</code> is outside the room. The change is still open. Change the path before trying again.</p>${btn('Fix path','fix-path',true)}</div>`:published?`<div class="ar-status good"><h3>Published</h3><p>This version was published successfully. Issue #1 was closed by this publication.</p><div class="ar-actions">${btn('View this published version','published-version',true)}${btn('View latest site','site')}</div></div>`:pending?`<div class="ar-status"><h3>Publication pending</h3><p>The request is recorded. The destination has not confirmed publication yet. The change remains open.</p>${btn('Check publication','check-publication')}</div>`:state.approved?`<div class="ar-status"><h3>Review recorded for this version</h3><p>Current room rules will be checked when you publish. An approval alone does not confirm publication.</p>${btn('Publish change','publish',true)}</div>`:`<div class="ar-status"><h3>Needs approval for protected files</h3><p>AGENTS.md needs one approval from a rules controller. The last publication attempt was refused. The change is still open.</p><div class="ar-actions">${btn('Review change','review',true)}${btn('Request review','request-review')}</div></div>`;
    const discussion=`<div class="ar-panel"><h3>@paul proposed this change</h3><p>${published?'Add a short guide for the first clone and edit.':path?'Add an introductory page for new members.':'Make the instructions clear about when a review is needed.'}</p>${published?'<p class="ar-muted ar-small">Closes issue #1 · Add a getting-started page</p>':''}</div><div class="ar-event"><span class="ar-avatar" aria-hidden="true">P</span><div class="ar-event-main"><strong>@paul</strong><p>Please check the wording before this is published.</p></div></div><form data-form="comment"><label class="ar-small" for="${this.prefix}-comment">Add a comment</label><textarea class="ar-input" id="${this.prefix}-comment" name="comment" rows="3" placeholder="Share a question or feedback…" required></textarea><div class="ar-actions" style="margin-top:10px">${btn('Comment','submit-comment')}</div></form>`;
    const file=path?'../outside.md':published?'guide/start.md':'AGENTS.md';
    const files=`<div class="ar-panel"><h3>${escape(file)}</h3><p class="ar-muted ar-small">Proposed version · one file</p><code class="ar-diff-add">+ ${published?'# Getting started\n+ Clone the room, then edit a page.':'# Agent instructions\n+ Ask for review before publishing protected files.'}</code><div class="ar-actions" style="margin-top:16px">${btn('Preview this version','preview')}</div></div>`;
    const checks=`<div class="ar-panel"><h3>Publication requirements</h3><p>${path?'File path validation failed.':published?'The destination confirmed publication for this version.':pending?'Waiting for the destination to confirm the result.':'Protected-file review: '+(state.approved?'one approval recorded.':'one rules controller approval needed.')}</p><p class="ar-muted">No automated checks are required in this sample room.</p><p class="ar-muted ar-small">The destination evaluates the current room rules at publication. Reviews apply to a specific proposal version.</p>${btn('Configure rules','rules')}</div>`;
    return `<button class="ar-link" data-action="changes" type="button">← Back to changes</button><h2>${title} <span class="ar-muted">#${path?4:published?2:3}</span></h2><div class="ar-detailhead">${tag(published?'Merged':'Open',published?'good':'')}<span class="ar-muted ar-small">@paul proposed one file · Version 5</span></div><div class="ar-grid"><div>${status}<nav class="ar-detailnav" aria-label="Change detail">${['discussion','files','checks'].map(x=>`<button class="ar-filter" type="button" data-tab="${x}" aria-pressed="${state.tab===x}">${x[0].toUpperCase()+x.slice(1)}${x==='files'?' · 1':''}</button>`).join('')}</nav>${state.tab==='files'?files:state.tab==='checks'?checks:discussion}</div><aside class="ar-sideinfo"><h3>Reviewers</h3><p>@hugh <span class="ar-muted">· Rules controller</span></p><h3>Changed file</h3><p>${escape(file)}</p><h3>Related work</h3><p>${published?'Issue #1 · Completed':'No linked issue'}</p><button class="ar-link" data-action="preview" type="button">Preview this version</button><details><summary>Technical details</summary><p class="ar-muted ar-small">Full version evidence, rule revisions, and publication receipts belong here. They are omitted from this design sample.</p></details></aside></div>`;
  }
  function create(){return `<div class="ar-form"><button class="ar-link" data-action="issues" type="button">← Back to rooms</button><h2>Create a room</h2><p class="ar-muted">Give the work a home. You can invite people and adjust the rules later.</p><form data-form="create"><label for="${this.prefix}-name">Room name</label><input class="ar-input" id="${this.prefix}-name" name="name" placeholder="Field notes" required maxlength="80"><label for="${this.prefix}-path">Room address</label><input class="ar-input" id="${this.prefix}-path" name="path" placeholder="field-notes" pattern="[a-z0-9]+(-[a-z0-9]+)*" required><p class="ar-help">Your workspace / <span data-slug>field-notes</span></p><div class="ar-panel"><h3>Ready for the first edit</h3><p class="ar-muted ar-small">Issues and changes are enabled. Protected files require a rules controller review. Publication happens only when you choose Publish.</p></div><details><summary>Advanced setup</summary><label for="${this.prefix}-remote">Import an existing repository</label><input class="ar-input" id="${this.prefix}-remote" name="remote" placeholder="Repository URL (optional)"><p class="ar-help">Leave this empty to start a new room. Hosting and rule details can be configured later.</p></details><div class="ar-actions"><button type="button" data-submit class="ar-btn ar-primary">Create room</button>${btn('Cancel','issues')}</div></form></div>`;}
  function rules(){return `<div class="ar-toolbar"><div><h2>Configure rules</h2><p class="ar-muted">Choose how work is reviewed before publication.</p></div></div><form data-form="rules"><div class="ar-rule"><div class="ar-rule-main"><label for="${this.prefix}-ordinary">Ordinary files</label><p>Pages, documentation, and other files outside protected groups.</p></div><select class="ar-input" id="${this.prefix}-ordinary" name="ordinary"><option>No approval required</option><option>One reviewer required</option><option>Two reviewers required</option></select></div><div class="ar-rule"><div class="ar-rule-main"><label for="${this.prefix}-protected">Protected instructions and workflows</label><p>AGENTS.md, CLAUDE.md, and automation workflows. Approval must come from a rules controller.</p></div><select class="ar-input" id="${this.prefix}-protected" name="protected"><option>One controller required</option><option>Two controllers required</option></select></div><div class="ar-rule"><div class="ar-rule-main"><label for="${this.prefix}-infra">Infrastructure files</label><p>Git configuration and deployment settings outside the protected group. Approval comes from a maintainer.</p></div><select class="ar-input" id="${this.prefix}-infra" name="infra"><option>No approval required</option><option>One maintainer required</option></select></div><div class="ar-check"><input type="checkbox" id="${this.prefix}-own" name="own"><label for="${this.prefix}-own">Allow an author's controller to approve their own work<br><span class="ar-muted ar-small">Off by default. A controller review is separate from authorship.</span></label></div><details><summary>Advanced rules</summary><label for="${this.prefix}-patterns">Protected file patterns</label><textarea class="ar-input ar-code" id="${this.prefix}-patterns" name="patterns" rows="4">**/AGENTS.md\n**/CLAUDE.md\n.github/workflows/**\n.github/actions/**</textarea><p class="ar-muted ar-small">Rules changes require permission to publish room rules. Pattern validation and conflict detection are required before applying them.</p></details><div class="ar-panel"><h3>Before you apply</h3><p class="ar-muted">New rules are evaluated when a change is published. Existing proposals may need new approvals.</p><p class="ar-muted ar-small">Signed in as @hugh · Rules controller</p></div><div class="ar-actions"><button class="ar-btn ar-primary" type="button" data-submit>Review rule changes</button>${btn('Cancel','issues')}</div></form>`;}
  function formScreen(kind){const isIssue=kind==='new-issue';return `<div class="ar-form"><button class="ar-link" data-action="${isIssue?'issues':'changes'}" type="button">← Back to ${isIssue?'issues':'changes'}</button><h2>${isIssue?'Create issue':'Edit a page'}</h2><form data-form="${isIssue?'issue':'edit'}"><label for="${this.prefix}-title">${isIssue?'Title':'File path'}</label><input class="ar-input" id="${this.prefix}-title" name="title" value="${kind==='fix-path'?'guide/intro.md':''}" placeholder="${isIssue?'What needs to happen?':'guide/intro.md'}" required><label for="${this.prefix}-body">${isIssue?'Description (optional)':'Page content'}</label><textarea class="ar-input" id="${this.prefix}-body" name="body" rows="6" placeholder="${isIssue?'Add a little context…':'Write your page…'}" ${isIssue?'':'required'}>${kind==='fix-path'?'# Introduction\nWelcome to the room.':''}</textarea><p class="ar-help">${isIssue?'Assignment and labels can be added later.':'Your edit creates a proposal. It will not publish without a separate Publish action.'}</p><div class="ar-actions"><button type="button" data-submit class="ar-btn ar-primary">${isIssue?'Create issue':'Propose change'}</button>${btn('Cancel',isIssue?'issues':'changes')}</div></form></div>`;}
  function review(){return `<div class="ar-form"><button class="ar-link" data-action="detail" type="button">← Back to change</button><h2>Review this version</h2><p class="ar-muted">Clarify the agent instructions · Version 5</p><form data-form="review"><label for="${this.prefix}-verdict">Decision</label><select class="ar-input" id="${this.prefix}-verdict" name="verdict"><option value="approve">Approve version</option><option value="changes">Request changes</option><option value="comment">Comment only</option></select><label for="${this.prefix}-feedback">Feedback (optional)</label><textarea class="ar-input" id="${this.prefix}-feedback" name="feedback" rows="4"></textarea><p class="ar-help">Signed in as @hugh · Rules controller. Approval is tied to this version and protected file group.</p><div class="ar-actions"><button class="ar-btn ar-primary" type="button" data-submit>Submit review</button>${btn('Cancel','detail')}</div></form></div>`;}
  function extra(){if(state.screen==='issue-detail'){const issue=issues.find(x=>x.n===state.selectedIssue)||issues[0];return `<button class="ar-link" data-action="issues" type="button">← Back to issues</button><h2>${escape(issue.title)} <span class="ar-muted">#${issue.n}</span></h2><div class="ar-detailhead">${tag(issue.status==='open'?'Open':'Closed')}<span class="ar-muted ar-small">Opened by ${issue.author} · ${escape(issue.assignee)}</span></div><div class="ar-panel"><p>A new member should see where to make their first edit without reading setup instructions.</p></div><div class="ar-actions">${btn('Edit page','edit',true)}${issue.status==='open'?btn('Close issue','close-issue'):''}</div>`;}if(state.screen==='rule-review')return `<h2>Review rule changes</h2><div class="ar-panel"><h3>Publication policy</h3><p>${escape(state.ruleSummary||'Review requirements updated.')}</p><p class="ar-muted">These changes will apply at publication, including to open proposals.</p></div><div class="ar-actions">${btn('Apply rules','apply-rules',true)}${btn('Keep editing','rules')}</div>`;if(['preview','site','published-version','pages'].includes(state.screen)){const proposal=state.screen==='preview';return `<button class="ar-link" data-action="${proposal?'detail':'issues'}" type="button">← Back to ${proposal?'change':'room'}</button><div class="ar-alert">${proposal?'Proposed version 5 · Unpublished · Isolated preview':state.screen==='published-version'?'Published version of change #2 · Pinned to its publication':'Latest published site · Sample content'}</div><article class="ar-site"><h2>${proposal?'Agent instructions':'Getting started'}</h2><p>${proposal?'Ask for review before publishing protected files.':'Clone the room, then edit a page.'}</p><p class="ar-muted">This sample shows how preview and published content stay distinct.</p></article>`;}return '';}
  function render(){controls.screen.value=['issues','changes','detail','create','rules'].includes(state.screen)?state.screen:controls.screen.value;controls.device.value=state.device;controls.state.value=state.sample;apps.forEach((app,index)=>{app.parentElement.dataset.device=state.device;const scope={prefix:`ar-${index}`};let content=state.screen==='issues'||state.screen==='changes'?listScreen(state.screen):state.screen==='detail'?detail.call(scope):state.screen==='create'?create.call(scope):state.screen==='rules'?rules.call(scope):['new-issue','edit','fix-path'].includes(state.screen)?formScreen.call(scope,state.screen):state.screen==='review-form'?review.call(scope):extra();app.innerHTML=shell(app,content);});}
  controls.screen.addEventListener('change',()=>setScreen(controls.screen.value));
  controls.device.addEventListener('change',()=>{state.device=controls.device.value;render();remember();});
  controls.state.addEventListener('change',()=>{state.sample=controls.state.value;state.approved=false;state.localEmpty=false;state.notice='';if(['review','path','pending','published'].includes(state.sample))state.screen='detail';else if(!['issues','changes','create','rules'].includes(state.screen))state.screen='issues';render();remember();});
  root.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-search]')){state.query=el.value;const app=el.closest('.ar-app'),html=listScreen(state.screen),holder=document.createElement('div');holder.innerHTML=html;app.querySelector('[data-rows]').innerHTML=holder.querySelector('[data-rows]').innerHTML;app.querySelector('[data-results]').textContent=holder.querySelector('[data-results]').textContent;announce(app.querySelector('[data-results]').textContent);}if(el.name==='name'){const form=el.closest('form'),slug=el.value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');form.elements.path.value=slug;form.querySelector('[data-slug]').textContent=slug||'room-address';}if(el.name==='path'){el.closest('form').querySelector('[data-slug]').textContent=el.value;}});
  root.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||!root.contains(el))return;if(el.hasAttribute('data-submit')){submitLocal(el.closest('form'));return;}if(el.dataset.filter){const appIndex=apps.indexOf(el.closest('.ar-app'));state.filter=el.dataset.filter;render();apps[appIndex].querySelector(`[data-filter="${state.filter}"]`).focus();remember();return;}if(el.dataset.tab){const appIndex=apps.indexOf(el.closest('.ar-app'));state.tab=el.dataset.tab;render();apps[appIndex].querySelector(`[data-tab="${state.tab}"]`).focus();return;}const action=el.dataset.action;if(!action)return;if(['issues','changes','rules','create','new-issue','edit','fix-path','preview','site','published-version','pages','issue-detail'].includes(action)){if(action==='issue-detail')state.selectedIssue=Number(el.dataset.number)||5;setScreen(action);return;}if(action==='detail'){state.sample=el.dataset.number==='4'?'path':el.dataset.number==='2'?'published':'review';setScreen('detail');return;}if(action==='clear'){state.query='';state.filter='all';render();return;}if(action==='review'){setScreen('review-form');return;}if(action==='request-review'){state.notice='Design sample: a review request was added for @hugh. No notification was sent.';render();return;}if(action==='publish'){state.sample='published';state.notice='Design sample: the destination confirmed publication. No real content was published.';render();announce('Sample publication confirmed.');return;}if(action==='check-publication'){state.notice='Design sample: publication is still pending. No confirmation is available; do not submit a duplicate request.';render();return;}if(action==='account'){state.notice='Design sample: signed in as @hugh, an admin and rules controller. Account settings would open here.';render();return;}if(action==='submit-comment'){submitLocal(el.closest('form'));return;}if(action==='apply-rules'){state.notice='Design sample: rules were applied. No real room settings changed.';state.screen='rules';render();return;}if(action==='close-issue'){const issue=issues.find(x=>x.n===state.selectedIssue);if(issue)issue.status='closed';state.notice='Design sample: the issue was closed locally. No real issue changed.';state.screen='issues';state.filter='closed';render();return;}});
  function submitLocal(form){if(!form?.dataset.form||!form.reportValidity())return;const values=new FormData(form),kind=form.dataset.form;if(kind==='create'){state.roomName=String(values.get('name'));state.localEmpty=true;state.sample='empty';state.screen='issues';state.notice='Design sample: room created with the standard setup. No real room was created.';}if(kind==='issue'){issues.unshift({n:7,title:String(values.get('title')),status:'open',author:'@hugh',assignee:'Unassigned',label:'New'});state.localEmpty=false;state.sample='populated';state.screen='issues';state.filter='open';state.notice='Design sample: issue added locally.';}if(kind==='edit'){const path=String(values.get('title'));if(path.startsWith('/')||path.split('/').includes('..')){state.notice='Use a file path inside the room, such as guide/intro.md.';render();return;}state.screen='detail';state.sample='review';state.notice='Design sample: a new proposal was saved locally. It has not been published.';}if(kind==='review'){state.approved=values.get('verdict')==='approve';state.screen='detail';state.sample='review';state.notice=state.approved?'Design sample: approval recorded for version 5. Publication is a separate action.':'Design sample: review feedback recorded. No real review was submitted.';}if(kind==='comment'){state.notice='Design sample: comment added locally. No real message was sent.';}if(kind==='rules'){state.ruleSummary=`Ordinary files: ${values.get('ordinary')}. Protected files: ${values.get('protected')}. Infrastructure: ${values.get('infra')}. Own-controller review: ${values.get('own')?'allowed':'not allowed'}.`;state.screen='rule-review';}render();remember();announce(state.notice||'Preview updated.');}
  root.addEventListener('submit',event=>{if(event.target.dataset.form){event.preventDefault();submitLocal(event.target);}});
  root.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')&&event.target.closest('form')){event.preventDefault();submitLocal(event.target.closest('form'));}});
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next&&typeof next==='object'){for(const key of ['screen','device','sample'])if(typeof next[key]==='string')state[key]=next[key];render();}});
  render();
  if(globalThis.Tweak){const design={density:'comfortable'};const tweak=new Tweak({container:root,onChange:()=>apps.forEach(app=>app.dataset.density=design.density)});tweak.addSelect(design,'density',{label:'List density',options:['comfortable','compact']});}
})();
</script>

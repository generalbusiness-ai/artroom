<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dap - workroom</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="icon" sizes="any" href="/brand/favicon.ico">
<style>
  @font-face { font-family: "Open Runde"; font-weight: 400; src: url("/brand/fonts/OpenRunde-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Open Runde"; font-weight: 500; src: url("/brand/fonts/OpenRunde-Medium.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Open Runde"; font-weight: 600; src: url("/brand/fonts/OpenRunde-Semibold.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Open Runde"; font-weight: 700; src: url("/brand/fonts/OpenRunde-Bold.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Teletype33"; src: url("/brand/fonts/Teletype33-Narrow.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Sometype Mono"; font-weight: 400; src: url("/brand/fonts/SometypeMono-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Sometype Mono"; font-weight: 500; src: url("/brand/fonts/SometypeMono-Medium.woff2") format("woff2"); font-display: swap; }
  :root {
    --paper: #F3F1EA; --rail: #FFFFFF; --ink: #16180F; --muted-ink: #6B6A5F;
    --line: #D8D5CB; --input-line: #6B6A5F; --accent: #123F2B; --on-accent: #FFFFFF;
    --selected: #DCE9E0; --success: #123F2B; --error: #7A1F2E;
    --addition: #DCE9E0; --addition-ink: #123F2B; --error-soft: #F1DEE1;
    --font-sans: "Open Runde", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --font-label: "Teletype33", ui-monospace, Menlo, monospace;
    --font-mono: "Sometype Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121410; --rail: #16180F; --ink: #ECEAE2; --muted-ink: #A3A295;
      --line: #2C2F27; --input-line: #A3A295; --accent: #5FA880; --on-accent: #16180F;
      --selected: #0B2E1F; --success: #5FA880; --error: #D98A96;
      --addition: #0B2E1F; --addition-ink: #5FA880; --error-soft: #3A1C22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121410; --rail: #16180F; --ink: #ECEAE2; --muted-ink: #A3A295;
    --line: #2C2F27; --input-line: #A3A295; --accent: #5FA880; --on-accent: #16180F;
    --selected: #0B2E1F; --success: #5FA880; --error: #D98A96;
    --addition: #0B2E1F; --addition-ink: #5FA880; --error-soft: #3A1C22;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-sans); }
  .artroom { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  .artroom > .screen { grid-column: 1 / -1; padding: 24px 30px; }
  .content { min-width: 0; padding: 24px 30px 36px; }
  .screen { margin: 0; min-width: 0; }
  .screen > section { margin: 24px 0; min-width: 0; }
  h1 { font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -.5px; margin: 0; overflow-wrap: anywhere; }
  h2 { font-size: 18px; line-height: 1.4; font-weight: 600; margin: 0 0 16px; }
  h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  p { margin: 0 0 16px; overflow-wrap: anywhere; }
  a { color: var(--accent); text-underline-offset: 3px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button, .button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  :where(a, button, input, textarea, select, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  input::placeholder, textarea::placeholder { color: var(--muted-ink); opacity: 1; }
  svg { flex: none; width: 18px; height: 18px; stroke-width: 1.75; }
  [hidden] { display: none !important; }
  .quiet, .muted, .meta, .record-meta { color: var(--muted-ink); }
  .small, .meta, .record-meta { font-size: 14px; }
  .hide, .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip { position: absolute; top: 8px; left: 8px; transform: translateY(-180%); z-index: 20; background: var(--paper); padding: 10px 12px; border-radius: 0; }
  .skip:focus { transform: translateY(0); }

  .rail { background: var(--rail); padding: 18px; display: flex; flex-direction: column; min-width: 0; gap: 12px; }
  .wordmark { display: block; line-height: 1.4; padding: 0 2px; }
  .wordmark img { display: block; width: calc(72px * 432 / 440); height: auto; }
  .wordmark .wordmark-dark { display: none; }
  :root[data-theme="dark"] .wordmark-light { display: none; }
  :root[data-theme="dark"] .wordmark-dark { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .wordmark-light { display: none; }
    :root:not([data-theme="light"]) .wordmark-dark { display: block; }
  }
  .room-switch { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: transparent; border-radius: 0; min-height: 44px; padding: 9px 10px; text-align: left; width: 100%; font-size: 14px; text-decoration: none; color: var(--ink); }
  details.shell-disclosure { position: relative; margin: 0; padding: 0; border: 0; min-width: 0; }
  .shell-disclosure > summary { list-style: none; cursor: pointer; }
  .shell-disclosure > summary::-webkit-details-marker { display: none; }
  .shell-disclosure[open] > summary { margin-bottom: 0; }
  .shell-disclosure-content { position: absolute; top: 100%; left: 0; z-index: 10; width: min(340px, calc(100vw - 32px)); padding: 12px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 4px 12px #0002; overflow-wrap: anywhere; }
  .shell-disclosure-content p { margin: 0 0 8px; }
  .shell-disclosure-content a { display: block; min-height: 44px; padding: 10px 0; }
  .account-disclosure .shell-disclosure-content { bottom: 100%; top: auto; }
  .room-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-name > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room-recorded-name { color: var(--muted-ink); font-size: 14px; font-weight: 400; }
  .room-switch svg:last-child { width: 14px; height: 14px; }
  .navigation { display: flex; flex-direction: column; gap: 6px; }
  .nav-item { display: flex; align-items: center; gap: 12px; min-height: 44px; border: 0; border-radius: 0; background: transparent; padding: 9px 10px; text-align: left; font-size: 14px; color: var(--ink); text-decoration: none; }
  .nav-item[aria-current="page"] { background: var(--selected); color: var(--accent); font-weight: 500; }
  .nav-item:hover, .room-switch:hover { background: var(--selected); }
  .rail-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 32px; }
  .account { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 10px; border: 0; background: transparent; text-align: left; font-size: 14px; color: var(--ink); text-decoration: none; min-width: 0; }
  .account-label { min-width: 0; overflow-wrap: anywhere; }
  .avatar { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 0; background: var(--line); color: var(--ink); font-size: 14px; flex: none; }
  .mobile-header { display: none; }

  .toolbar { display: flex; gap: 24px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar > .button { margin-left: auto; }
  .toolbar-actions { display: flex; justify-content: flex-end; align-items: flex-end; gap: 10px; margin-left: auto; }
  .toolbar-actions form { display: flex; align-items: flex-end; gap: 10px; margin: 0; }
  .toolbar-actions form > label { margin: 0; }
  .toolbar-actions .inspect-actions { margin: 0; }
  .toolbar > [data-action-slot="create"] { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  [data-action-slot="next"] { display: flex; align-items: flex-end; gap: 8px; }
  [data-action-slot="next"] form { margin: 0; }
  [data-task-status] { margin: 16px 0; color: var(--muted-ink); font-size: 14px; }
  .search { display: flex; align-items: center; gap: 9px; flex: 0 1 314px; min-height: 44px; border: 1px solid var(--input-line); border-radius: 0; padding: 0 11px; background: var(--rail); color: var(--muted-ink); max-width: 314px; min-width: 140px; }
  .search:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search input { border: 0; background: transparent; width: 100%; max-width: none; min-width: 0; padding: 8px 0; font-size: 16px; }
  .search input:focus-visible { outline: none; }
  .filters, .tabs { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .filter, .tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted-ink); padding: 10px 3px; min-height: 44px; font-size: 14px; white-space: nowrap; }
  .filter[aria-pressed="true"], .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  button:where(:not(.filter, .tab, .nav-item, .room-switch, .account, .work-title, .icon-button, .link-button)), .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; border: 1px solid var(--line); border-radius: 0; background: var(--paper); padding: 9px 12px; font-size: 14px; font-weight: 500; }
  .button { text-decoration: none; }
  button, .button { mask-image: linear-gradient(135deg, #000 0 calc(100% - 6.364px), transparent calc(100% - 6.364px)); }
  button:focus-visible, .button:focus-visible { mask-image: none; }
  .meta, .record-meta, .work-meta, .condition, .state, .version-label, .rule-path, form label, .filter, .tab, .answer, .dap-ack { font-family: var(--font-label); letter-spacing: 0; }
  table, .number, .line-number { font-family: var(--font-mono); }
  .dap-ack { color: var(--success); }
  .diff-line.removed .diff-text { background: var(--error-soft); color: var(--error); }
  .primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:hover:not(:disabled), .button:hover { filter: brightness(.97); }
  .link-button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--accent); padding: 8px 0; min-height: 44px; font-size: 14px; text-align: left; }
  .icon-button { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 0; padding: 8px; color: var(--muted-ink); }
  .short-label { display: none; }
  section.actions { display: block; max-width: 650px; margin: 24px 0; }
  section.actions > details { margin: 16px 0; }
  section.actions form { padding: 4px 0 12px; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .screen-head, .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }

  .work-list { padding: 0; margin: 0; list-style: none; }
  .work-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .work-row:last-child { border-bottom: 0; }
  .entry-marker { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-top: 5px; flex: none; }
  .entry-marker::before { content: ""; width: 10px; height: 10px; border: 1.7px solid currentColor; transform: rotate(45deg); }
  .entry-marker.recorded::before { background: currentColor; }
  .entry-marker { color: var(--muted-ink); }
  .work-icon { display: inline-grid; place-items: center; flex: none; width: 18px; height: 24px; color: var(--muted-ink); line-height: 1; }
  .work-copy { min-width: 0; flex: 1; }
  .work-title { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); font-weight: 550; font-size: 16px; text-align: left; line-height: 1.5; padding: 0; min-height: 44px; overflow-wrap: anywhere; text-decoration: none; }
  .work-title:hover { color: var(--accent); }
  .work-meta { display: block; color: var(--muted-ink); font-size: 14px; font-weight: 400; margin-top: 4px; overflow-wrap: anywhere; }
  .row-end { color: var(--muted-ink); font-size: 14px; padding-top: 2px; flex: 0 1 auto; }
  .mobile-date { display: none; }
  .condition, .state { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; overflow-wrap: anywhere; }
  .condition.good, .state-published, .state-merged, .state-met, .state-passed, .state-closed { color: var(--success); }
  .condition.bad, .state-refused, .state-failed, .state-not-reserved { color: var(--error); }
  .blank { padding: 76px 0; text-align: center; color: var(--muted-ink); }
  .blank p { margin: 0 0 10px; }

  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 24px; }
  .detail-heading { flex: 1; min-width: 200px; }
  .number { color: var(--muted-ink); font-size: 20px; font-weight: 400; white-space: nowrap; margin-left: 8px; }
  .back { padding: 8px; margin-bottom: 12px; }
  .detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted-ink); font-size: 14px; margin-top: 12px; }
  .tabs { border-bottom: 1px solid var(--line); gap: 26px; margin-bottom: 22px; overflow-x: auto; }
  .tab { padding: 11px 0; }
  .panel { min-width: 0; margin: 24px 0; }
  .filebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 14px; flex-wrap: wrap; }
  .filename { min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 9px; font-weight: 500; }
  .diff { border: 1px solid var(--line); border-radius: 0; overflow: auto; max-width: 100%; font: 14px/1.6 var(--font-mono); }
  .diff-line { display: grid; grid-template-columns: 38px minmax(0, 1fr); min-height: 28px; }
  .line-number { color: var(--muted-ink); background: var(--rail); text-align: right; padding: 3px 9px; font-size: 14px; }
  .diff-text { padding: 3px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff-line.added .diff-text { background: var(--addition); color: var(--addition-ink); }
  .blocker { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; border-left: 2px solid var(--error); padding: 4px 0 4px 14px; }
  .blocker p { margin: 0; font-size: 14px; }
  .discussion { max-width: 680px; }
  .description { margin-bottom: 26px; }
  .comment, .merge { padding: 18px 0; border-top: 1px solid var(--line); }
  .comment p { margin: 8px 0 0; }
  .comment-author { font-size: 14px; font-weight: 500; }
  .composer { margin-top: 22px; }
  .composer > label { margin-bottom: 10px; }
  .composer > button { display: flex; margin-left: auto; }
  .composer .actions { justify-content: flex-end; margin-top: 10px; }
  .answer { border-left: 2px solid var(--input-line); padding: 8px 0 8px 14px; margin: 16px 0; font-size: 14px; }
  .answer p:last-child { margin-bottom: 0; }
  .ok { color: var(--success); border-color: var(--success); }
  .bad { color: var(--error); border-color: var(--error); }

  .form-layout { max-width: 650px; margin-inline: auto; }
  .form-layout h1 { margin-bottom: 28px; }
  .field { margin-bottom: 20px; }
  dl > .field { display: contents; }
  form label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 7px; }
  input, select, textarea, .input { display: block; width: 100%; min-width: 0; border: 1px solid var(--input-line); border-radius: 0; background: var(--paper); padding: 10px 12px; min-height: 44px; font-size: 16px; line-height: 1.5; resize: vertical; }
  input[type="hidden"] { display: none; }
  input[type="checkbox"], input[type="radio"] { display: inline-block; width: 20px; min-height: 20px; padding: 0; vertical-align: middle; }
  textarea { min-height: 112px; }
  form > label { margin-bottom: 20px; }
  form > label :where(input, select, textarea) { margin-top: 7px; }
  form > button + button { margin-left: 8px; }
  .form-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 26px; }
  .error-text { color: var(--error); font-size: 14px; margin-top: 7px; }
  .error-text:empty { display: none; }
  .rule-row { display: grid; grid-template-columns: minmax(0, 1fr) 188px; gap: 22px; align-items: center; border-bottom: 1px solid var(--line); padding: 20px 0; }
  .rule-label { display: block; font-weight: 500; margin-bottom: 4px; }
  .rule-path { color: var(--muted-ink); font-size: 14px; overflow-wrap: anywhere; }
  .rule-row select { min-height: 44px; font-size: 16px; }

  details { min-width: 0; margin: 20px 0; border-top: 1px solid var(--line); padding-top: 6px; }
  summary { cursor: pointer; font-size: 14px; color: var(--muted-ink); min-height: 44px; padding: 10px 0; overflow-wrap: anywhere; }
  details[open] > summary { margin-bottom: 12px; }
  .inspection { margin-top: 32px; }
  dl { display: grid; grid-template-columns: minmax(100px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 8px 0 20px; font-size: 14px; }
  dt { color: var(--muted-ink); }
  dd { margin: 0; overflow-wrap: anywhere; }
  table { border-collapse: collapse; width: 100%; background: var(--paper); font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { font-weight: 500; }
  .table-scroll { max-width: 100%; overflow-x: auto; }
  .record-table { min-width: 100%; }
  .record-table th, .record-table td { min-width: 90px; max-width: 260px; }
  code, pre { font: 14px/1.6 var(--font-mono); }
  code { overflow-wrap: anywhere; }
  pre { padding: 12px; max-width: 100%; overflow-x: auto; background: var(--rail); border: 1px solid var(--line); border-radius: 0; }
  .states { padding-left: 20px; }
  .states li { margin: 8px 0; }
  .page-list .work-row { align-items: center; }
  .reading { max-width: 68ch; margin: 20px auto 0; }
  .reading p { line-height: 1.7; }
  .page-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .version-label { font-size: 14px; color: var(--muted-ink); }

  .room-dialog {
    width: 440px; max-width: calc(100vw - 24px); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px);
    margin: auto; padding: 28px; overflow-y: auto; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 0; box-shadow: 0 12px 44px #16180F22;
  }
  .room-dialog::backdrop { background: #16180F2e; }
  .room-dialog h1 { margin-bottom: 24px; font-size: 22px; }
  .room-dialog form { min-width: 0; }
  .dialog-close { float: right; margin: -10px -10px 0 10px; }
  .room-dialog .form-footer { flex-wrap: wrap; }
  .room-dialog .answer { margin-bottom: 0; }
  @media (prefers-color-scheme: dark) {
    .room-dialog { box-shadow: 0 12px 44px #0005; }
    .room-dialog::backdrop { background: #0008; }
  }

  @media (max-width: 760px) {
    .artroom { display: block; }
    .room-dialog { padding: 22px 18px; }
    .rail { display: none; }
    .mobile-header { display: block; border-bottom: 1px solid var(--line); padding: 12px 16px 0; }
    .mobile-context { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
    .mobile-context .room-disclosure { flex: 1; }
    .mobile-context .room-disclosure .shell-disclosure-content { width: min(340px, calc(100vw - 128px)); }
    .mobile-context .account-disclosure .shell-disclosure-content { top: 100%; bottom: auto; left: auto; right: 0; }
    .mobile-context .room-switch { flex: 1; min-width: 0; border: 0; padding: 4px 0; font-size: 16px; width: auto; max-width: none; }
    .mobile-context .room-name { font-size: 14px; }
    .mobile-context .account { padding: 6px; min-width: 44px; justify-content: center; }
    .mobile-context .avatar { width: 32px; height: 32px; }
    .mobile-context .account-label { display: none; }
    .mobile-nav { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
    .mobile-nav .nav-item { background: transparent; border-radius: 0; padding: 10px 2px; border-bottom: 2px solid transparent; justify-content: center; gap: 7px; flex: 1; }
    .mobile-nav .nav-item[aria-current="page"] { border-bottom-color: var(--accent); }
    .content, .artroom > .screen { padding: 20px 16px 28px; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-bottom: 8px; }
    .toolbar > .button { margin-left: 0; justify-self: end; }
    .toolbar > [data-action-slot="create"] { margin-left: 0; justify-self: end; }
    .search { grid-column: 1 / -1; max-width: none; margin-bottom: 4px; }
    .filters { gap: 10px; }
    .filter { padding: 10px 0; }
    .full-label { display: none; }
    .short-label { display: inline-flex; align-items: center; gap: 6px; }
    .work-row { gap: 12px; }
    .row-end .date { display: none; }
    .row-end:has(.date) { display: none; }
    .mobile-date { display: inline; }
    .change-list .work-row { flex-wrap: wrap; }
    .change-list .work-copy { flex-basis: calc(100% - 32px); }
    .change-list .row-end { padding: 0 0 0 30px; }
    .detail-heading { min-width: 0; flex-basis: 100%; }
    h1 { font-size: 22px; }
    .number { font-size: 18px; }
    .detail-top { gap: 12px; margin-bottom: 18px; }
    .detail-top .actions { width: 100%; }
    .detail-meta { gap: 8px; margin-top: 10px; }
    .tabs { gap: 22px; margin-bottom: 18px; }
    .blocker { flex-wrap: wrap; gap: 8px; }
    .rule-row { grid-template-columns: 1fr; gap: 12px; padding: 18px 0; }
    .form-footer { flex-wrap: wrap; }
    dl { grid-template-columns: minmax(0, 1fr); gap: 3px; }
    dd { margin-bottom: 9px; }
  }
